<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entradas al Metro</title>
  <style>
    :root {
      color-scheme: dark;
      color: #faf4df;
      font: 500 clamp(18px, 1.25vw, 24px)/1.2 system-ui, sans-serif;
      --edge: clamp(12px, 1.6vw, 30px);
    }

    body { margin: 0; }

    main {
      box-sizing: border-box;
      position: fixed;
      left: var(--edge);
      bottom: clamp(50px, 6.7vh, 80px);
      width: clamp(300px, 22vw, 420px);
      max-width: calc(100% - 2 * var(--edge));
      padding: .75rem .9rem;
      border: 1px solid #4b6186;
      border-radius: .45rem;
      background: #101b34;
    }

    h1 {
      margin: 0 0 .2rem;
      font-size: 1.38rem;
      letter-spacing: -.035em;
    }

    p { margin: 0; color: #c5d0e7; font-size: .86rem; }

    table {
      width: 100%;
      margin-top: .5rem;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td { padding: .24rem 0; border-top: 1px solid #4b6186; }
    th { text-align: left; }

    td {
      text-align: right;
      color: #79ddd4;
      font-size: 1.17rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .decrease td { color: #ffdc78; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">Entradas al Metro</h1>
      <p id="scenario">Cambio estimado · día laboral</p>
    </header>

    <!-- Ejemplo de la corrida A/B eee8cf8b60c35bba7810771d25c12cae9ce84370.
         Fuente: https://discord.com/channels/1573514576400752640/1573809606277337280/1573818751726387290 -->
    <table aria-labelledby="title" aria-describedby="scenario">
      <tbody>
        <tr class="decrease" data-delta="-2584.3">
          <th scope="row">Tobalaba</th>
          <td>−2,6 mil</td>
        </tr>
        <tr data-delta="2278.2">
          <th scope="row">Pedrero</th>
          <td>+2,3 mil</td>
        </tr>
        <tr data-delta="1843.5">
          <th scope="row">Mirador</th>
          <td>+1,8 mil</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
