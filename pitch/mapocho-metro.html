<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santiaguito · Mapocho y torre</title>
  <style>
    @font-face {
      font-family: Barlow;
      src: url("../viz/assets/barlow/Barlow-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: JetBrainsMono;
      src: url("../tools/terminal-font/JetBrainsMonoNerdFontMono-Regular.ttf") format("truetype");
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: 1vh .8vw;
      display: grid;
      grid-template-rows: 1fr;
      gap: 2vh;
      color: #fff;
      background: #101923;
      font-family: Barlow, system-ui, sans-serif;
    }
    main {
      width: 100%;
      margin: auto;
      display: grid;
      gap: 2.8vh;
    }
    .intro h1 {
      margin: 0 0 .14em;
      font-size: clamp(1.5rem, min(4.1vw, 6.9vh), 5rem);
      font-weight: 400;
      line-height: 1.02;
    }
    .scenarios {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto auto;
      column-gap: .8vw;
      row-gap: 1.6vh;
    }
    section {
      display: grid;
      grid-row: span 2;
      grid-template-rows: subgrid;
    }
    section h2 {
      align-self: end;
      margin: 0;
      padding: .45em .6em;
      min-height: 4.4em;
      font: 400 clamp(.9rem, min(2.2vw, 4vh), 2.8rem) / 1.15 JetBrainsMono, monospace;
      background: #05090d;
      border: 1px solid #2c3d4f;
      border-radius: .3em;
    }
    .prompt { color: #8dd0ff; }
    .cursor::after {
      content: "";
      display: inline-block;
      width: .55em;
      height: 1em;
      margin-left: .1em;
      vertical-align: -.12em;
      background: #fff;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .run { display: block; min-height: 1.15em; color: #8dd0ff; }
    .run.done { color: #7ee2a8; }
    section video { opacity: 0; transition: opacity .6s; }
    section.ready video { opacity: 1; }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0b1219;
    }
    #fondo {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(3px) brightness(.22);
      
    }
    /* Slow panoramic drift across the city. */
    @keyframes pan {
      from { transform: scale(1.3) translate(-10%, 4%); }
      to { transform: scale(1.3) translate(10%, -4%); }
    }
    footer {
      color: #dce4ef;
      font-size: clamp(.55rem, 1vw, 1rem);
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <video id="fondo" src="media/santiago-fondo.mp4" muted loop autoplay playsinline oncanplay="this.playbackRate = .15"></video>
  <main>
    <div class="scenarios">
      <section aria-labelledby="mapocho-question">
        <h2 id="mapocho-question"><span class="prompt">❯ </span><span class="typed" data-text="¿Y si hubiera un ferry en el Mapocho?"></span><span class="run"></span></h2>
        <video id="ferry" src="media/mapocho-muelle-ferry.mp4" muted loop playsinline preload="auto"
          aria-label="Replay completo del ferry simulado en el Mapocho"></video>
      </section>
      <section aria-labelledby="torre-question">
        <h2 id="torre-question"><span class="prompt">❯ </span><span class="typed" data-text="¿Y si copiamos la Gran Torre en Puente Alto?"></span><span class="run"></span></h2>
        <video id="torre" src="media/torre-puente-alto.mp4" muted loop playsinline preload="auto"
          aria-label="Replay de una copia de la Gran Torre Costanera en Puente Alto"></video>
      </section>
    </div>
  </main>
  <script>
    const ferry = document.querySelector('#ferry');
    const torre = document.querySelector('#torre');

    const spinner = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
    let timer;

    // Type both prompts, press Enter, show the run, then reveal the looping results.
    function playSlide() {
      clearInterval(timer);
      const sections = [...document.querySelectorAll('section')];
      for (const section of sections) {
        section.classList.remove('ready');
        section.querySelector('.typed').textContent = '';
        section.querySelector('.typed').classList.add('cursor');
        section.querySelector('.run').textContent = '';
        section.querySelector('.run').className = 'run';
      }
      for (const video of [ferry, torre]) {
        video.pause();
        video.currentTime = 0;
      }
      let tick = 0;
      const longest = Math.max(...sections.map(s => s.querySelector('.typed').dataset.text.length));
      timer = setInterval(() => {
        tick++;
        for (const section of sections) {
          const typed = section.querySelector('.typed');
          const run = section.querySelector('.run');
          typed.textContent = typed.dataset.text.slice(0, tick);
          if (tick === longest + 8) {
            typed.classList.remove('cursor');
          }
          if (tick > longest + 12 && tick <= longest + 52) {
            run.textContent = spinner[tick % spinner.length] + ' santiaguito simulando…';
          }
          if (tick === longest + 53) {
            run.textContent = '✓ simulación lista';
            run.classList.add('done', 'cursor');
            section.classList.add('ready');
          }
        }
        if (tick === longest + 53) {
          clearInterval(timer);
          for (const video of [ferry, torre]) {
            video.playbackRate = 1.25;
            video.play().catch(() => {});
          }
        }
      }, 45);
    }

    document.addEventListener('click', playSlide);
    document.addEventListener('keydown', event => {
      if (event.code === 'Space' || event.code === 'KeyR') {
        event.preventDefault();
        playSlide();
      }
    });
    playSlide();
  </script>
</body>
</html>
