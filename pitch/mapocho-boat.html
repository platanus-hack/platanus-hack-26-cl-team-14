<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapocho navegable</title>
<style>
html, body { margin: 0; height: 100%; background: #151c25; color: #fff; font-family: system-ui, sans-serif; }
main { height: 100%; display: grid; place-items: center; }
canvas { width: min(100vw, 177.78vh); height: auto; }
h1 { position: absolute; top: 5vh; left: 5vw; margin: 0; font-size: clamp(1.5rem, 4vw, 4rem); text-shadow: 0 2px 6px #151c25; }
</style>
<main>
  <h1>Mapocho navegable</h1>
  <canvas width="1920" height="1080" role="img" aria-label="Maqueta de un barco en el río Mapocho, entre Purísima y Pío Nono, junto al Parque Forestal"></canvas>
</main>
<script type="module">
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const {width, height} = canvas;
const scale = height / 0.0036;
const lonScale = Math.cos(33.435 * Math.PI / 180);

function project([lon, lat]) {
  return [width / 2 + (lon + 70.637) * scale * lonScale, height / 2 - (lat + 33.43559) * scale];
}

function trace(coordinates) {
  coordinates.forEach((coordinate, index) => {
    const [x, y] = project(coordinate);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
}

function fillPolygon(rings, color) {
  ctx.beginPath();
  for (const ring of rings) {
    trace(ring);
    ctx.closePath();
  }
  ctx.fillStyle = color;
  ctx.fill('evenodd');
}

function stroke(lines, color, width) {
  ctx.beginPath();
  lines.forEach(trace);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function label(text, coordinate) {
  const [x, y] = project(coordinate);
  ctx.font = '600 31px system-ui';
  ctx.textAlign = 'center';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#151c25';
  ctx.fillStyle = '#fff';
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
}

const [ground, mapocho, landmarks] = await Promise.all(
  ['ground', 'mapocho_detail', 'santiago_landmarks'].map(async name => {
    const response = await fetch('../web/data/' + name + '.geojson');
    return (await response.json()).features;
  })
);

ctx.fillStyle = '#263140';
ctx.fillRect(0, 0, width, height);
for (const {geometry, properties} of ground) {
  if (properties.kind === 'park') fillPolygon(geometry.coordinates, '#285140');
}
const forestal = landmarks.find(({properties}) => properties.id === 'parque_forestal');
fillPolygon(forestal.geometry.coordinates, '#35674e');
stroke(ground.filter(({properties}) => properties.kind === 'road').map(({geometry}) => geometry.coordinates), '#667080', 9);

for (const {geometry, properties} of mapocho) {
  if (properties.kind === 'water') {
    for (const polygon of geometry.coordinates) fillPolygon(polygon, '#217791');
  }
}
const bridges = mapocho.filter(({properties}) => properties.kind === 'bridge').map(({geometry}) => geometry.coordinates);
stroke(bridges, '#151c25', 27);
stroke(bridges, '#9199a3', 16);

// Widen the ferry symbol at this camera scale so the cabin and wake read from the back of the room.
const ferry = [-70.63765, -33.435435];
const [boatX, boatY] = project(ferry);
const [bowX, bowY] = project([-70.637, -33.43559]);
ctx.save();
ctx.translate(boatX, boatY);
ctx.rotate(Math.atan2(bowY - boatY, bowX - boatX));
ctx.strokeStyle = '#b4eff3';
ctx.lineWidth = 5;
ctx.beginPath();
ctx.moveTo(-40, -10);
ctx.lineTo(-76, -20);
ctx.moveTo(-40, 10);
ctx.lineTo(-76, 20);
ctx.stroke();
ctx.fillStyle = '#fff2c5';
ctx.strokeStyle = '#102534';
ctx.lineWidth = 5;
ctx.beginPath();
ctx.moveTo(-44, -20);
ctx.lineTo(24, -20);
ctx.quadraticCurveTo(43, -17, 51, 0);
ctx.quadraticCurveTo(43, 17, 24, 20);
ctx.lineTo(-44, 20);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.fillStyle = '#183c4d';
ctx.beginPath();
ctx.roundRect(-23, -13, 50, 26, 7);
ctx.fill();
ctx.fillStyle = '#80d5dc';
ctx.fillRect(8, -10, 13, 20);
ctx.restore();

label('Río Mapocho', [-70.6394, -33.43501]);
label('Puente Pío Nono', [-70.6354, -33.43554]);
label('Parque Forestal', [-70.63865, -33.43586]);
</script>
</html>
