 if(t>15){crowd.forEach(p=>{const k=clamp((t-15-p.d)/(4.5*p.s));if(k<=0)return;const e=ease(k),o=P(p.r.lon+p.j[0],p.r.lat+p.j[1]);
  const u=mx_+(o[0]-mx_)*e,v=my_+(o[1]-my_)*e-Math.sin(e*Math.PI)*H*.04;x.globalAlpha=k<1?1:.35;x.fillStyle=p.col;x.beginPath();x.arc(u,v,2.4,0,7);x.fill()});x.globalAlpha=1}
 // the MUT tower fades out and a stadium bowl with its pitch grows in its place
 const m=ease((t-.8)/1.6),R=Math.max(12,.0018/C.span*H);
 x.save();x.translate(mx_,my_);
 if(m<1){x.globalAlpha=1-m;x.shadowBlur=40;x.shadowColor='#38e1ff';x.fillStyle='#0d3a4a';x.strokeStyle='#38e1ff';x.lineWidth=Math.max(2,R*.06);
  const s=R*.7;x.fillRect(-s,-s,2*s,2*s);x.strokeRect(-s,-s,2*s,2*s);x.shadowBlur=0;
  for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){x.fillStyle='rgba(56,225,255,.7)';x.fillRect(a*s*.38-s*.08,b*s*.38-s*.08,s*.16,s*.16)}}
 if(m>0){x.globalAlpha=m;const g=.6+.4*m;x.shadowBlur=50;x.shadowColor='#ffb020';
  x.fillStyle='#3a2a10';x.beginPath();x.ellipse(0,0,R*1.45*g,R*1.1*g,0,0,7);x.fill();
  x.strokeStyle='#ffb020';x.lineWidth=Math.max(3,R*.16);x.stroke();x.shadowBlur=0;
  x.strokeStyle='rgba(255,176,32,.45)';x.lineWidth=Math.max(1,R*.05);x.beginPath();x.ellipse(0,0,R*1.18*g,R*.88*g,0,0,7);x.stroke();
  const fw=R*1.5*g,fh=R*.95*g;x.fillStyle='#2f9e4f';x.fillRect(-fw/2,-fh/2,fw,fh);
  x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=Math.max(1,R*.03);x.strokeRect(-fw/2,-fh/2,fw,fh);
  x.beginPath();x.moveTo(0,-fh/2);x.lineTo(0,fh/2);x.stroke();x.beginPath();x.arc(0,0,fh*.2,0,7);x.stroke()}
 x.restore();
 // shot 1's amber glow shrinks into the stadium
 if(T<2.5){const g=1-ease(T/2.5);x.save();x.shadowBlur=40;x.shadowColor='#ffb020';x.fillStyle=`rgba(255,176,32,${g})`;x.beginPath();x.ellipse(mx_,my_,12+18*g,10+12*g,0,0,7);x.fill();x.restore()}
 }
// ?rec: no clock, the exporter calls draw(t) for each frame
if(!location.search.includes('rec')){const frame=now=>{draw((now-t0)/1000);requestAnimationFrame(frame)};requestAnimationFrame(frame)}
