const commute=[];D.flows.forEach(f=>{for(let i=0;i<f.d/12;i++)commute.push({f,d:Math.random()*3,j:[(Math.random()-.5)*.01,(Math.random()-.5)*.01]})});

 if(t>11){const k=ease((t-11)/1.5);D.stations.forEach(s=>{if(Math.abs(s.d)<40)return;const[u,v]=P(s.lon,s.lat),r=Math.sqrt(Math.abs(s.d))*.28*k;
