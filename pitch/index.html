<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentación de Santiaguito</title>
  <style>
    @font-face {
      font-family: Barlow;
      src: url("../viz/assets/barlow/Barlow-Regular.ttf") format("truetype");
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: white;
      background: #101923;
      font-family: Barlow, system-ui, sans-serif;
    }
    #slide { width: 100vw; height: 100svh; }
    #slide > iframe, #slide > img {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
    }
    #slide > iframe { pointer-events: none; }
    button {
      padding: .35em .8em;
      font: inherit;
      color: inherit;
      background: #101923;
      border: 1px solid #85b9dd;
      border-radius: .25em;
      cursor: pointer;
    }
    nav {
      position: fixed;
      right: .9rem;
      bottom: .9rem;
      display: flex;
      gap: .45rem;
      opacity: 0;
    }
    nav:hover, nav:focus-within { opacity: 1; }
    button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <main id="slide" aria-label="Lámina actual"></main>
  <nav aria-label="Láminas">
    <button id="back" type="button">Atrás</button>
    <button id="next" type="button">Siguiente</button>
  </nav>
  <script>
    const slides = [
      { id: 'mapocho-metro', title: 'Mapocho y Metro', page: 'mapocho-metro.html' },
      { id: 'evaluacion', title: 'Evaluación: cierre de la USACH', page: 'evaluacion.html', step: 0 },
      { id: 'evaluacion-2', title: 'Evaluación: extensión de Línea 2', page: 'evaluacion.html', step: 1 },
      { id: 'evaluacion-3', title: 'Evaluación: partido en el Monumental', page: 'evaluacion.html', step: 2 },
      { id: 'qr', title: 'QR para descargar santiaguito.cl', page: 'qr.html' },
      { id: 'datos', title: 'Datos y parámetros', page: 'datos.html' },
      { id: 'enjambre', title: 'Cómo trabajó el enjambre', page: 'swarm/index.html' },
    ];

    const stage = document.querySelector('#slide');
    const back = document.querySelector('#back');
    const next = document.querySelector('#next');
    let index = 0;

    function openFromHash() {
      show(slides.findIndex(slide => '#' + slide.id === location.hash));
    }

    function show(target) {
      index = Math.max(0, Math.min(target, slides.length - 1));
      const slide = slides[index];
      history.replaceState(null, '', '#' + slide.id);
      stage.setAttribute('aria-label', slide.title);

      const current = stage.querySelector('iframe');
      if (current && current.dataset.page === slide.page && slide.step !== undefined) {
        // Same page, next carousel step: slide the cards instead of reloading.
        current.contentWindow.postMessage(slide.step, '*');
      } else if (slide.page) {
        const frame = document.createElement('iframe');
        frame.src = slide.page + '?' + Date.now() + '#' + (slide.step || 0);
        frame.dataset.page = slide.page;
        frame.title = slide.title;
        frame.tabIndex = -1;
        frame.allow = 'autoplay';
        stage.replaceChildren(frame);
      } else {
        const image = document.createElement('img');
        image.src = slide.image;
        image.alt = slide.title;
        stage.replaceChildren(image);
      }

      back.disabled = index === 0;
      next.disabled = index === slides.length - 1;
    }

    back.onclick = () => show(index - 1);
    next.onclick = () => show(index + 1);
    document.addEventListener('keydown', event => {
      if (event.target instanceof HTMLButtonElement && event.key === 'Enter') return;
      if (event.key === 'ArrowLeft') show(index - 1);
      if (event.key === 'ArrowRight' || event.key === 'Enter') show(index + 1);
      if (event.key === 'r') show(index);
    });
    window.addEventListener('hashchange', openFromHash);
    openFromHash();
  </script>
</body>
</html>
