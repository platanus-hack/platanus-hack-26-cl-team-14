<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Santiago</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=block">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe2bd; color: #1c2438;
    font: 700 1.9vw/1.15 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  #map { position: absolute; inset: 0; }
  .hud { position: absolute; z-index: 1; pointer-events: none; padding: .5vw 1.2vw; border-radius: 1vw; background: #fffdf6e8; box-shadow: 0 .3vw 0 #1c243826; }
  #title { top: 2vw; left: 2vw; font-size: 4.6vw; letter-spacing: .04em; }
  #side { top: 2vw; right: 2vw; text-align: right; } #side small { display: block; font-size: 1.45vw; color: #4a556e; }
  #side i { display: inline-block; width: 1.9vw; height: .95vw; border-radius: .5vw; margin: 0 .4vw 0 1.3vw; }
  #nm { bottom: 13.2vw; left: 2vw; font-size: 2.5vw; background: #ffd23f; } #nm:empty, #read:empty { display: none; }
  #off { top: 45%; left: 50%; transform: translate(-50%); font-size: 3vw; } #off[hidden] { display: none; }
  #read { bottom: 2vw; left: 2vw; display: flex; gap: 3.5vw; }
  #read b { display: block; font-size: 6vw; line-height: .95; }
  .gain { color: #00934a; } .loss { color: #e0222c; }
</style>
<body>
<div id="map"></div>
<div class="hud" id="title">Santiago</div>
<div class="hud" id="side"><i style="background:#26355d"></i>auto<i style="background:#f5a300"></i>micro<i style="background:#161a26"></i>metro<i style="background:#8a4fff"></i>bici<i style="background:#ff4f9a"></i>a pie
  <small>vehículos: representación de los flujos del modelo</small><small>modelo, no medición · © OpenStreetMap contributors</small></div>
<div class="hud" id="nm"></div>
<div class="hud" id="off" hidden>sin conexión con el motor</div>
<div class="hud" id="read"></div>
<script>
// One view and no controls: a toy model of Santiago that renders the result of POST /api/scenario.
// Each result arrives on the stream GET /api/scenario-events. Every number on the screen is a field of that result.
const {DeckGL, MapView, GeoJsonLayer, ColumnLayer, PathLayer, ScatterplotLayer, TextLayer, TripsLayer, FlyToInterpolator, LightingEffect, AmbientLight, DirectionalLight} = deck;
const API = (new URLSearchParams(location.search).get('api') || 'http://localhost:8787') + '/api/';  // ?api=http://localhost:8797 for another engine
const $ = id => document.getElementById(id);
const get = u => fetch(u).then(r => r.json());
const fmt = (n, d = 0) => n.toLocaleString('es-CL', {maximumFractionDigits: d});
const signed = v => (v > 0 ? '+' : '') + fmt(v);
const many = (n, f) => Array.from({length: n}, (_, j) => f(j));
const hash = (i, j) => { const x = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return x - Math.floor(x); };  // a fixed draw for each thing: the same car stays on the same route in each result
const KM = (a, b) => Math.hypot((a[0] - b[0]) * 93, (a[1] - b[1]) * 111);
const route = path => { let d = 0; return {path, cum: path.map((p, i) => d += i && KM(path[i - 1], p))}; };

const GAIN = [0, 168, 84], LOSS = [224, 34, 44], tone = v => v > 0 ? GAIN : LOSS;
const CAR = [38, 53, 93], BUS = [245, 163, 0], METRO = [22, 26, 38], BIKE = [138, 79, 255], WALK = [255, 79, 154];
const HOUSE = [[255, 246, 222], [250, 216, 168], [240, 172, 132], [255, 228, 144], [232, 124, 94], [250, 250, 244]], GLASS = [[176, 204, 228], [150, 186, 216], [204, 222, 238]];
const CITY = [[-70.7991, -33.6324], [-70.5031, -33.3379]];  // where the people of the 34 urban comunas live, data/mvp/README.md
let cam = {zoom: 10.6}, res = null, data, communes, ground, boxes, real;
let marks = [], tops = [], hotMin = 100, grown = [], fallen = [], fallenIds = new Set(), risen = true;
const changed = s => Math.abs(s.delta_daily) >= hotMin;
const down = b => risen && (b.id ? fallenIds.has(b.id) : fallen.some(q => KM(q, b.p) < .15));  // a block volume by its id, a real footprint by its distance

const deckgl = new DeckGL({container: 'map', views: new MapView({orthographic: true}), controller: true,
  initialViewState: {longitude: -70.65, latitude: -33.48, zoom: 10.6, pitch: 50, bearing: -18},
  onViewStateChange: ({viewState}) => { cam = viewState; },
  effects: [new LightingEffect({ambient: new AmbientLight({intensity: 1.15}), sun: new DirectionalLight({direction: [-3, -5, -6], intensity: 1.5})})]});

// ---------- Movement: the things that travel. A drawing of the modeled flows, not an engine output ----------
const LOOP = 24;
let moved = {};

// All moving things of one result: {path, ts, color, width}. Each count is a rendering density, with its scale in the comment.
function moves(r, data) {
  // `sets` departures in each loop of 24 s, at fixed random moments; a route longer than one loop has copies in the earlier loops
  const run = (p, speed, sets, seed, color, width) => {
    const laps = Math.ceil(p.cum.at(-1) / speed / LOOP), m = Math.floor(sets + hash(seed, 0));
    return many(m * (laps + 1), j => ({path: p.path, ts: p.cum.map(c => (hash(seed, 1 + j % m) - (j / m | 0)) * LOOP + c / speed), color, width}));
  };
  const MODE = {car: [data.carRoutes, CAR, .6, 4], public: [data.publicRoutes, BUS, .5, 4], bicycle: [data.bicycleRoutes, BIKE, .25, 3], walk: [{}, WALK, .12, 3]};
  // Groups of workers of the result (trips_scenario), on the street, transit or bicycle route of their comuna pair: 1 departure for each 300 workers.
  // A group with no route of the pair (same comuna, walk) goes in a straight line between its two points.
  const riders = r.trips_scenario.flatMap((t, i) => {
    const [table, color, speed, width] = MODE[t.mode] || [];
    return table ? run(table[t.origin_cut + '-' + t.destination_cut] || route([t.origin, t.destination]), speed, t.count / 300, i, color, width) : [];
  });
  // A changed comuna pair (flows): its change at 10 times that density, in the gain or loss colour, split by the public share of the home comuna
  const pub = Object.fromEntries(r.zones.map(z => [z.id, z.public_share_scenario]));
  const hotRiders = r.flows.flatMap((f, i) => ['car', 'public'].flatMap(mode => {
    const p = MODE[mode][0][f.origin + '-' + f.destination], share = mode == 'car' ? 1 - pub[f.origin] : pub[f.origin];
    return p ? run(p, MODE[mode][2], Math.abs(f.scenario - f.base) * share / 30, i + .5, tone(f.scenario - f.base), 7) : [];
  }));
  // Trains and buses on their real paths: the scheduled departures of the weekday, 1 train for each 10 and 1 bus for each 100
  const transit = data.transit.flatMap((p, i) => p.mode == 'metro' ? run(p, 1.1, p.trips.reduce((a, b) => a + b) / 10, i + .25, METRO, 7)
    : run(p, .5, p.trips.reduce((a, b) => a + b) / 100, i + .25, BUS, 5));
  // A station with a large change: thick trains in the gain or loss colour on the 2.5 km of line at each side of it
  const hot = r.stations.filter(changed), top = Math.max(...hot.map(s => Math.abs(s.delta_daily)));
  const hotRail = hot.flatMap(s => data.transit.filter(p => p.mode == 'metro').flatMap((p, n) => {
    const i = p.path.findIndex(q => KM(q, [s.longitude, s.latitude]) < .4);
    if (i < 0) return [];
    const a = p.cum.findIndex(c => c > p.cum[i] - 2.5), b = p.cum.findLastIndex(c => c < p.cum[i] + 2.5) + 1;
    return run({path: p.path.slice(a, b), cum: p.cum.slice(a, b).map(c => c - p.cum[a])}, 1.1, 5, i + n / 16, tone(s.delta_daily), 8 + 8 * Math.sqrt(Math.abs(s.delta_daily) / top));
  }));
  // Walkers to each station: 1 departure for each 300 boardings of the day; a change shows at 10 times that density
  const walk = r.stations.flatMap((s, i) => {
    const some = (n, color, width, salt) => many(Math.round(n), j => {
      const a = hash(i, salt + j) * 2 * Math.PI, d = .25 + .6 * hash(i, salt + j + .5), start = hash(j, salt + i) * (LOOP - 8);
      return {path: [[s.longitude + d * Math.cos(a) / 93, s.latitude + d * Math.sin(a) / 111], [s.longitude, s.latitude]], ts: [start, start + d / .12], color, width};
    });
    return [...some(s.scenario_daily / 300, WALK, 3, 0), ...(changed(s) ? some(Math.abs(s.delta_daily) / 30, tone(s.delta_daily), 5, 5000) : [])];
  });
  return {trips: [...riders, ...transit, ...walk, ...hotRiders, ...hotRail]};
}

// data = {transit, carRoutes, publicRoutes, bicycleRoutes}
function moveLayers(result, data, timeSeconds) {
  if (moved.result != result) moved = {result, ...moves(result, data)};
  const k = innerWidth / 1920, top = {parameters: {depthCompare: 'always', depthWriteEnabled: false}};
  return [
    new PathLayer({id: 'rails', ...top, data: data.transit.filter(p => p.mode == 'metro'), getPath: p => p.path, getColor: p => [...p.rgb, 130], getWidth: 36, widthMinPixels: 3 * k}),
    // a short tail makes each mover an object, not a line; when the camera is near the tail is shorter and the mover is wider
    new TripsLayer({id: 'moves', ...top, data: moved.trips, getPath: x => x.path, getTimestamps: x => x.ts, getColor: x => x.color, getWidth: x => x.width, widthUnits: 'pixels', widthScale: k * Math.max(1, 2 ** ((cam.zoom - 11.4) / 2.2)),
      capRounded: true, fadeTrail: true, trailLength: .45 * 2 ** ((10.8 - cam.zoom) / 2), currentTime: timeSeconds % LOOP}),
  ];
}

// ---------- City ----------
function frame(points, wide) {
  const k = innerWidth / 1920, xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const {longitude, latitude, zoom} = new deck.WebMercatorViewport({width: innerWidth, height: innerHeight}).fitBounds(
    [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]],
    {padding: wide ? 0 : {top: 300 * k, bottom: 330 * k, left: 260 * k, right: 260 * k}, maxZoom: 12.6});
  deckgl.setProps({initialViewState: {longitude, latitude, zoom: zoom + (wide ? .3 : -.3), pitch: 50, bearing: -18, transitionDuration: 2400, transitionInterpolator: new FlyToInterpolator()}});
}

function applyScenario(r) {
  res = r;
  const zone = Object.fromEntries(r.zones.map(z => [z.id, [z.longitude, z.latitude]]));
  const station = id => r.stations.find(s => s.id == id), at = b => [b.longitude, b.latitude];
  const place = {point: g => [[g.longitude, g.latitude]], block: g => [at(r.blocks_changed.find(b => b.id == g.id))], comuna: g => [zone[g.id]],
    pair: g => [zone[g.origin], zone[g.destination]], station: g => [[station(g.id).longitude, station(g.id).latitude]]};
  const word = {jobs: 'empleos', residents: 'residentes', minutes: 'min'}, op = {add: '', multiply: '×', set: '= '};
  // one mark for each change that the engine applied: its place and the change as the engine read it
  marks = r.applied.map(c => ({p: place[c.target.type](c.target), cut: c.target.type == 'comuna' && c.target.id,
    text: c.kind == 'station' ? (c.value ? 'ABRE ' : 'CIERRA ') + station(c.target.id).name
      : ((c.op == 'add' ? signed(c.value) : op[c.op] + fmt(c.value, 2)) + ' ' + word[c.kind]).toUpperCase()}));
  // buildings rise where the engine added jobs or residents (blocks_changed), and fall where it removed them.
  // Drawing scale: 1 new box for each 1,500 persons of a block, 24 at most; its height grows with the square root of the persons.
  grown = []; fallen = []; fallenIds = new Set();
  r.blocks_changed.forEach((b, n) => {
    const d = b.jobs_delta + b.residents_delta, count = Math.min(24, Math.ceil(d / 1500)), colors = b.jobs_delta > b.residents_delta ? GLASS : HOUSE;
    if (d < 0) { fallenIds.add(b.id); if (fallen.length < 40) fallen.push(at(b)); }
    else grown.push(...many(count, j => ({p: [b.longitude + (j && hash(n, j) - .5) * .008, b.latitude + (j && hash(j, n) - .5) * .007],
      h: 50 + 5 * Math.sqrt(d / count) * (.6 + .8 * hash(n, j + .5)), c: colors[j % 3].map((x, i) => (x + GAIN[i]) / 2)})));
  });
  const s = r.summary, gain = s.top_station_gains[0], loss = s.top_station_losses[0];
  hotMin = Math.max(100, ...[gain, loss].map(x => x ? Math.abs(x.delta_daily) / 20 : 0));  // 100 boardings in a day, and 1/20 of the largest change
  tops = [gain, loss].filter(x => x && Math.abs(x.delta_daily) >= hotMin).map(x => r.stations.find(y => y.name == x.name));  // a label on the map only for a large change
  const item = (cls, n, text) => `<div><b class="${cls}">${n}</b>${text}</div>`;
  $('read').innerHTML = marks.length
    ? (gain ? item('gain', signed(gain.delta_daily), gain.name + ' · subidas al día') : '')
      + (loss ? item('loss', signed(loss.delta_daily), loss.name + ' · subidas al día') : '')
      + item('', fmt(s.workers_moved), 'cambian de lugar de trabajo')
    : item('', fmt(s.boardings_base), 'subidas al metro al día') + item('', fmt(s.workers_base), 'personas van a trabajar');
  const kind = {station: 'estaciones nuevas', event: 'eventos'};
  $('nm').textContent = r.not_modeled.length ? 'El motor aún no simula: ' + [...new Set(r.not_modeled.map(c => kind[c.kind] || c.kind))].join(', ') : '';
  if (marks.length) frame([...marks.flatMap(m => m.p), ...tops.map(x => [x.longitude, x.latitude])]); else frame(CITY, true);
  risen = false; setTimeout(() => risen = true, 2200);  // the buildings move after the camera arrives
}

function city(now) {
  const k = innerWidth / 1920, pulse = now / 1600 % 1;
  const zones = Object.fromEntries(res.zones.map(z => [z.id, z]));
  const dz = z => Math.abs(z.jobs_scenario - z.jobs_base) > Math.abs(z.residents_working_scenario - z.residents_working_base)
    ? z.jobs_scenario - z.jobs_base : z.residents_working_scenario - z.residents_working_base;
  const dzMax = Math.max(1, ...res.zones.map(z => Math.abs(dz(z))));
  const top = {parameters: {depthCompare: 'always', depthWriteEnabled: false}};
  const label = {...top, fontFamily: 'Barlow Condensed', fontWeight: 700, characterSet: 'auto', getSize: 46 * k, background: true, backgroundPadding: [14 * k, 6 * k]};
  const fall = fallen.length && res.revision + ':' + risen;  // the 73,000 buildings are computed again only when some of them fall
  const solid = {extruded: true, material: {ambient: .55, diffuse: .6, shininess: 4}, getElevation: b => down(b) ? b.h * .08 : b.h, getFillColor: b => down(b) ? [240, 150, 150] : b.c,
    updateTriggers: {getElevation: fall, getFillColor: fall}, transitions: {getElevation: 1600}};
  return [
    new GeoJsonLayer({id: 'comunas', data: communes, getLineColor: [150, 172, 132], getLineWidth: 1.5 * k, lineWidthUnits: 'pixels',
      getFillColor: f => { const z = zones[f.properties.cut], a = z ? dz(z) / dzMax : 0; return Math.abs(a) > .15 ? tone(a).map(x => 222 + (x - 222) * (.15 + .4 * Math.abs(a))) : [218, 228, 198]; },
      updateTriggers: {getFillColor: res}, transitions: {getFillColor: 900}}),
    new GeoJsonLayer({id: 'ground', data: ground, stroked: true, getFillColor: [178, 216, 160],
      getLineColor: f => /river|canal/.test(f.properties.kind) ? [112, 178, 232] : [255, 255, 255],
      getLineWidth: f => f.properties.kind == 'river' ? 45 : f.properties.major ? 15 : 7, lineWidthUnits: 'meters'}),
    new PathLayer({id: 'roads', data: data.roads, getPath: f => f.geometry.coordinates, getColor: f => f.properties.kind == 'motorway' ? [255, 222, 150] : [255, 255, 255],
      getWidth: f => f.properties.kind == 'motorway' ? 34 : 20, widthMinPixels: 1.3 * k}),
    new deck.SolidPolygonLayer({id: 'boxes', ...solid, data: boxes, getPolygon: b => b.square}),
    new deck.SolidPolygonLayer({id: 'real', ...solid, data: real, getPolygon: f => f.polygon}),
    new ColumnLayer({id: 'grown', extruded: true, material: solid.material, diskResolution: 4, radius: 85, angle: 45, flatShading: true, data: grown, getPosition: b => b.p,
      getElevation: b => risen ? b.h : 0, getFillColor: b => b.c, updateTriggers: {getElevation: risen}, transitions: {getElevation: 2600}}),
    new GeoJsonLayer({id: 'targets', ...top, data: communes.features.filter(f => marks.some(m => m.cut == f.properties.cut)), filled: false,
      getLineColor: [28, 36, 56], getLineWidth: (5 + 3 * Math.sin(pulse * 2 * Math.PI)) * k, lineWidthUnits: 'pixels'}),
    ...moveLayers(res, data, now / 1000),
    // a station: white disc. A closed station: grey. A station with a large change: a large disc in the gain or loss colour
    new ScatterplotLayer({id: 'stations', ...top, data: res.stations, getPosition: s => [s.longitude, s.latitude], radiusUnits: 'pixels', lineWidthUnits: 'pixels', stroked: true,
      getRadius: s => (changed(s) ? 11 : 5) * k, getLineWidth: 2 * k, getLineColor: [28, 36, 56],
      getFillColor: s => changed(s) ? tone(s.delta_daily) : s.scenario_daily ? [255, 255, 255] : [130, 136, 150], updateTriggers: {getRadius: res, getFillColor: res}}),
    new ScatterplotLayer({id: 'ring', ...top, data: [...marks.flatMap(m => m.cut ? [] : m.p), ...tops.map(s => [s.longitude, s.latitude])], getPosition: p => p, filled: false, stroked: true,
      getRadius: (16 + 80 * pulse) * k, radiusUnits: 'pixels', getLineWidth: 7 * k, lineWidthUnits: 'pixels', getLineColor: [28, 36, 56, 255 * (1 - pulse)], updateTriggers: {getLineColor: pulse}}),
    new TextLayer({id: 'tops', ...label, data: tops, getPosition: s => [s.longitude, s.latitude], getText: s => s.name + '  ' + signed(s.delta_daily),
      getColor: [255, 255, 255], getBackgroundColor: s => tone(s.delta_daily), getPixelOffset: [0, -70 * k]}),
    new TextLayer({id: 'marks', ...label, data: marks, getPosition: m => m.p[0], getText: m => m.text, getColor: [255, 255, 255], getBackgroundColor: [28, 36, 56], getPixelOffset: [0, 120 * k]}),
  ];
}

(async () => {
  const [roads, volumes, foot, transit, cars, publics, bicycles] = await Promise.all([get('../data/mvp/roads.geojson'),
    ...['city_blocks', 'city_footprints', 'transit_paths', 'car_routes', 'public_routes', 'bicycle_routes'].map(f => get('data/' + f + '.json')), document.fonts.load('700 46px "Barlow Condensed"')]);
  [communes, ground] = await Promise.all([get('../data/mvp/communes.geojson'), get('data/ground.geojson')]);
  const table = (routes, path = v => v) => Object.fromEntries(Object.entries(routes).map(([key, v]) => [key, route(path(v))]));
  data = {roads: roads.features, transit: transit.map(p => ({...p, ...route(p.path), rgb: p.color.match(/\w\w/g).map(x => parseInt(x, 16))})),
    carRoutes: table(cars), publicRoutes: table(publics, v => v.path), bicycleRoutes: table(bicycles)};
  // Buildings. In the frame of city_footprints.json: the real OpenStreetMap footprints, 2.5 times their height (a toy city reads from far).
  // In the rest of the city: one volume for each census block (city_blocks.json: lon, lat, side, height, comuna, block). Heights are a display assumption.
  const [w, south, e, north] = foot.bounds, pick = (set, i) => set[hash(i, 3) * set.length | 0];
  real = foot.buildings.map((f, i) => { const h = f.height_m || f.levels * foot.metres_per_level || foot.default_height_m; return {polygon: f.polygon, p: f.polygon[0][0], h: h * 2.5, c: pick(h > 30 ? GLASS : HOUSE, i)}; });
  boxes = volumes.filter(([x, y]) => x < w || x > e || y < south || y > north).map(([x, y, side, h, , id], i) => { const a = side * .65 / 93000, b = side * .65 / 111000;
    return {id, h, c: pick(HOUSE, i), square: [[x - a, y - b], [x + a, y - b], [x + a, y + b], [x - a, y + b]]}; });
  // The stream gives the last result at each connection, also after an engine restart. With no engine the browser tries again.
  const stream = new EventSource(API + 'scenario-events');
  stream.addEventListener('scenario', e => applyScenario(JSON.parse(e.data)));
  stream.onerror = () => $('off').hidden = false;
  stream.onopen = async () => { $('off').hidden = true; await get(API + 'scenario-latest') || fetch(API + 'scenario', {method: 'POST', headers: {'content-type': 'application/json'}, body: '{"changes":[]}'}); };
  (function loop(now) { if (res) deckgl.setProps({layers: city(now)}); requestAnimationFrame(loop); })(0);
})();
</script>
</html>
