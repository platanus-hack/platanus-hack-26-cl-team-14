<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Tobalaba</title>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f24; color: #fff; overflow: hidden;
    font: 700 28px/1.1 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #map { position: absolute; inset: 0; }
  .box { position: absolute; padding: 20px 28px; background: rgba(10, 15, 36, .78); border-radius: 20px; }
  #clock { top: 28px; left: 28px; font-size: 150px; font-variant-numeric: tabular-nums; cursor: pointer; }
  #clock small { display: block; font-size: 30px; color: #9fb0d8; }
  #score { top: 28px; right: 28px; text-align: right; font-size: 110px; }
  #score small { display: block; font-size: 30px; color: #9fb0d8; }
  #panel { bottom: 28px; left: 28px; width: 560px; }
  #go { width: 100%; padding: 22px; font: inherit; font-size: 46px; color: #0a0f24; background: #ff7a1a;
    border: 0; border-radius: 16px; cursor: pointer; }
  #go.on { background: #fff; }
  #homes { font-size: 64px; margin: 18px 0 4px; font-variant-numeric: tabular-nums; }
  #homes small { font-size: 30px; color: #9fb0d8; }
  input[type=range] { width: 100%; height: 44px; accent-color: #ff7a1a; }
  #delta { bottom: 28px; right: 28px; text-align: right; font-size: 90px; display: none; font-variant-numeric: tabular-nums; }
  #delta small { display: block; font-size: 30px; color: #9fb0d8; }
  #ph { top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-8deg); font-size: 60px; color: #ffd400;
    border: 6px solid #ffd400; background: none; pointer-events: none; opacity: .85; display: none; }
  .more { color: #ff4d6d; } .less { color: #3ddc97; }
</style>
<div id="map"></div>
<div id="clock" class="box"><span id="hhmm">--:--</span><small><span id="now">0</span> subidas · Metro Tobalaba</small></div>
<div id="score" class="box"><span id="sc">—</span><small>puntaje</small></div>
<div id="panel" class="box">
  <button id="go">Sacar el MUT</button>
  <div id="homes"><span id="n">500</span> <small>viviendas</small></div>
  <input id="slider" type="range" min="0" max="2000" step="50" value="500">
</div>
<div id="delta" class="box"><span id="dv">0</span><small>subidas al día</small></div>
<div id="ph" class="box">placeholder</div>
<script>
const {DeckGL, MapView, GeoJsonLayer, ColumnLayer, ArcLayer, LightingEffect, AmbientLight, DirectionalLight} = deck;
const MUT = [-70.6009, -33.4180];
const SCALE = 0.1;            // metres of column for each boarding in a half hour
const FIRST = 11, LAST = 47;  // 05:30 to 23:30
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('es-CL');
const isMut = f => /MUT|Mercado Urbano Tobalaba/.test(f.properties.name);
const isMetro = s => !/^P[A-J]\d/.test(s.stop_id);
const at = (a, t) => { const i = Math.floor(t), j = Math.min(i + 1, 47); return a[i] + (a[j] - a[i]) * (t - i); };

let run, buildings, ground, t = FIRST, playing = true, active = false, homes = 500;

// footprint of the new tower: a 44 m square on the MUT site
const d = 0.00024, tower = [{polygon: [[MUT[0] - d, MUT[1] - d * .85], [MUT[0] + d, MUT[1] - d * .85], [MUT[0] + d, MUT[1] + d * .85], [MUT[0] - d, MUT[1] + d * .85]]}];

const deckgl = new DeckGL({
  container: 'map',
  views: new MapView({orthographic: true}),
  initialViewState: {longitude: -70.6015, latitude: -33.4183, zoom: 15.4, pitch: 55, bearing: -28},
  controller: true,
  effects: [new LightingEffect({
    ambient: new AmbientLight({intensity: 1.6}),
    sun: new DirectionalLight({direction: [-2, -4, -3], intensity: 2.2})})],
});

function layers() {
  const key = active ? 'scenario' : 'base';
  const fill = s => {
    const diff = active ? at(s.scenario, t) - at(s.base, t) : 0;
    return diff > 0.5 ? [255, 77, 109] : diff < -0.5 ? [61, 220, 151] : isMetro(s) ? [0, 229, 255] : [255, 212, 0];
  };
  return [
    new GeoJsonLayer({id: 'ground', data: ground, stroked: false,
      getFillColor: [26, 74, 62], getLineColor: f => f.properties.kind == 'river' ? [40, 110, 200] : f.properties.major ? [70, 84, 130] : [38, 48, 86],
      getLineWidth: f => f.properties.kind == 'river' ? 40 : f.properties.major ? 16 : 7, lineWidthUnits: 'meters'}),
    new GeoJsonLayer({id: 'buildings', data: buildings, extruded: true, stroked: false,
      getElevation: f => isMut(f) && active ? 0 : f.properties.h,
      getFillColor: f => isMut(f) ? [255, 122, 26] : [150, 165, 205],
      material: {ambient: .45, diffuse: .7, shininess: 8},
      updateTriggers: {getElevation: active}, transitions: {getElevation: 900}}),
    new deck.PolygonLayer({id: 'tower', data: tower, extruded: true, getPolygon: o => o.polygon,
      getElevation: active ? homes * 0.12 : 0, getFillColor: [255, 255, 255],
      updateTriggers: {getElevation: [active, homes]}, transitions: {getElevation: 900}}),
    active && new ColumnLayer({id: 'ghost', data: run.stops, getPosition: s => [s.lon, s.lat], diskResolution: 20,
      radius: 26, getElevation: s => at(s.base, t) * SCALE, getFillColor: [255, 255, 255, 60], updateTriggers: {getElevation: t}}),
    new ColumnLayer({id: 'stops', data: run.stops, getPosition: s => [s.lon, s.lat], diskResolution: 20,
      radius: 18, getElevation: s => at(s[key], t) * SCALE, getFillColor: fill,
      material: {ambient: .9, diffuse: .3}, updateTriggers: {getElevation: [t, key], getFillColor: [t, key]}}),
    active && new ArcLayer({id: 'flows', data: run.flows, getSourcePosition: f => f.from, getTargetPosition: f => f.to,
      getWidth: f => 2 + Math.sqrt(f.persons), getSourceColor: [255, 255, 255], getTargetColor: [255, 122, 26]}),
  ];
}

function draw() {
  const i = Math.floor(t);
  $('hhmm').textContent = String(i >> 1).padStart(2, '0') + ':' + (i % 2 ? '30' : '00');
  $('now').textContent = fmt(run.stops[0][active ? 'scenario' : 'base'][i]);
  deckgl.setProps({layers: layers()});
}

function tick() {
  if (playing) { t += 1 / 50; if (t >= LAST) t = FIRST; draw(); }  // about 0.85 s for each half hour
  requestAnimationFrame(tick);
}

$('clock').onclick = () => playing = !playing;
$('slider').oninput = e => { homes = +e.target.value; $('n').textContent = fmt(homes); draw(); };
$('go').onclick = () => {
  active = !active;
  $('go').textContent = active ? 'Volver al MUT' : 'Sacar el MUT';
  $('go').className = active ? 'on' : '';
  const sum = k => run.stops.reduce((a, s) => a + s[k].reduce((x, y) => x + y, 0), 0), dd = sum('scenario') - sum('base');
  $('dv').textContent = (dd > 0 ? '+' : '') + fmt(dd);
  $('dv').className = dd > 0 ? 'more' : dd < 0 ? 'less' : '';
  $('delta').style.display = active ? 'block' : 'none';
  draw();
};

// shortcut: reads a static file, change this URL to the engine when it gives per-stop estimates
Promise.all(['data/run.json', 'data/buildings.geojson', 'data/ground.geojson'].map(u => fetch(u).then(r => r.json()))).then(([r, b, g]) => {
  run = r; buildings = b; ground = g;
  run.stops.sort((a, b) => Math.max(...b.observed) - Math.max(...a.observed));  // stops[0] is Tobalaba
  if (run.placeholder) $('ph').style.display = 'block';
  else $('sc').textContent = run.score.toLocaleString('es-CL', {maximumFractionDigits: 2});
  const q = new URLSearchParams(location.search);  // ?t=36&mut=1 gives a fixed frame for screenshots
  if (q.has('t')) { t = +q.get('t'); playing = false; }
  if (q.has('mut')) $('go').onclick(); else draw();
  tick();
});
</script>
</html>
