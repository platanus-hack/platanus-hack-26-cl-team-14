[package]
name = "santiago-miniature"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = "0.24"
bevy = { version = "=0.20.1", default-features = false, features = ["std", "default_app", "multi_threaded", "bevy_winit", "bevy_pbr", "bevy_post_process", "bevy_ui_render", "default_font", "png"] }
flate2 = "1"
geo = { version = "0.33.1", default-features = false }
earcutr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
portable-pty = "0.9"
wry = { version = "=0.57.3", default-features = false }

# Browser build: WebGPU drawing and the bindings to the page. The ink pass reads scene depth, which WebGL2 cannot do.
[target.'cfg(target_family = "wasm")'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["webgpu"] }
wasm-bindgen = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["x11"] }

[profile.dev]
debug = 0
incremental = false
