[package]
name = "santiago-miniature"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "default_app", "multi_threaded", "bevy_winit", "bevy_pbr", "bevy_post_process", "bevy_ui_render", "default_font", "png"] }
flate2 = "1"
geo = { version = "0.33.1", default-features = false }
earcutr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["x11"] }

[profile.dev]
debug = 0
incremental = false
