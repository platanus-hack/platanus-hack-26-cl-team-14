[package]
name = "santiago-scenario-core"
version = "0.1.0"
edition = "2024"
default-run = "santiago-scenario-core"

[dependencies]
axum = "0.8"
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
